    <script type="text/javascript">
      const Swipe = swipe.default;
      const s = new Swipe(document.getElementById('stream'));

      s.on('show', i => {
        console.log('shown.', i);
      });

      window.addEventListener('keyup', e => {
        if (e.keyCode === 37) s.prev();
        if (e.keyCode === 39) s.next();
      });
