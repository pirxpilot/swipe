<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no, width=device-width"
    />
    <style>
      body {
        padding: 5px;
        font: 14px sans-serif;
      }

      #container {
        width: 295px;
        height: 380px;
        overflow: hidden;
      }

      .larger #container {
        width: 500px;
      }

      ul {
        margin: 0;
        padding: 0;
        height: 380px;
      }

      ul li {
        display: table-cell;
        vertical-align: top;
        background: #f8f8f8;
        background-size: cover;
        background-position: 50% 0;
        width: 300px;
        height: 380px;
        line-height: 380px;
        text-align: center;
        list-style: none;
        margin: 0;
        padding: 0;
        color: white;
        -ms-user-select: none;
        -webkit-user-select: none;
        user-select: none;
        font-size: 55px;
        font-weight: bold;
      }

      .larger ul li {
        width: 600px;
      }

      button {
        margin: 5px 0;
        border: 1px solid #ddd;
        padding: 5px 10px;
        background: #eee;
        border-radius: 2px;
        cursor: pointer;
      }

      button:hover {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <ul>
        <li
          class="angry"
          style="
            background-image: url(https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=300&h=380&fit=crop);
          "
        >
          0
        </li>
        <li
          class="tarter"
          style="
            background-image: url(https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=300&h=380&fit=crop);
          "
        >
          1
        </li>
        <li
          class="wtf"
          style="
            background-image: url(https://images.unsplash.com/photo-1464207687429-7505649dae38?w=300&h=380&fit=crop);
          "
        >
          2
        </li>
        <li
          class="grumpy"
          style="
            background-image: url(https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=300&h=380&fit=crop);
          "
        >
          3
        </li>
      </ul>
    </div>

    <button onclick="cats.prev()">prev</button>
    <button onclick="cats.next()">next</button>
    <button onclick="cats.play()">play</button>
    <button onclick="cats.stop()">stop</button>
    <button onclick="remove(0)">remove(0)</button>
    <button onclick="remove(2)">remove(2)</button>
    <br />
    <button onclick="add(0)">add(0)</button>
    <button onclick="add(2)">add(2)</button>
    <button onclick="hide(0)">hide(0)</button>
    <button onclick="hide(2)">hide(2)</button>
    <button onclick="show(0)">show(0)</button>
    <button onclick="show(2)">show(2)</button>
    <button onclick="resize()">resize()</button>

    <script src="../build/build.js"></script>
    <script>
      const Swipe = swipe.default;
      const el = document.querySelector('#container');
      const cats = new Swipe(el);
      cats.interval(800);

      // biome-ignore lint/correctness/noUnusedVariables: used in onclick
      function resize() {
        document.body.className = 'larger';
        cats.refresh();
      }

      // biome-ignore lint/correctness/noUnusedVariables: used in onclick
      function remove(i) {
        var parent = cats.child;
        var el = parent.children[i];
        if (!el) return;
        parent.removeChild(el);
        cats.refresh();
      }

      // biome-ignore lint/correctness/noUnusedVariables: used in onclick
      function add(i) {
        var parent = cats.child;
        var el = parent.children[i];
        var li = document.querySelector('ul li').cloneNode(true);
        if (!el) parent.appendChild(li);
        else parent.insertBefore(li, el);
        cats.refresh();
      }

      // biome-ignore lint/correctness/noUnusedVariables: used in onclick
      function hide(i) {
        var parent = cats.child;
        var el = parent.children[i];
        if (!el) return;
        el.style.display = 'none';
        cats.refresh();
      }

      // biome-ignore lint/correctness/noUnusedVariables: used in onclick
      function show(i) {
        var parent = cats.child;
        var el = parent.children[i];
        if (!el) return;
        el.style.display = 'table-cell';
        cats.refresh();
      }
    </script>
  </body>
</html>
